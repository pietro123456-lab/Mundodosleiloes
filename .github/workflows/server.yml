name: Backend CI and Deploy
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server JavaScript syntax
        run: node --check server/src/index.js
      - name: Build Docker image
        run: docker build -t mundo-dos-leiloes-api ./server
  deploy:
    needs: validate
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
